<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><style>*{box-sizing:border-box}body{margin:0;background:#050b15;color:#eaf2ff;font-family:system-ui;padding:14px}main{max-width:520px;margin:auto}section{background:#0c1729;border:1px solid #1c2b44;border-radius:17px;padding:14px;margin:10px 0}.hero h1{color:#4ee897}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.box{background:#091322;padding:12px;border-radius:12px}small,p{color:#8495b2}.up{color:#4ee897}.down{color:#ff6b7a}button{width:100%;padding:13px;border:0;border-radius:12px;background:#17263d;color:white;font-weight:700}</style></head><body><main><h2>Gaurav Signal Scanner V25</h2><p>Real FOREX data • 5-minute analysis • paper testing</p><section class="hero"><small id="pair">SCANNING…</small><h1 id="side">WAIT</h1><h2 id="price">—</h2><p id="why">Connecting to public backend…</p></section><section><div class="grid"><div class="box">Score<br><b id="score">—</b></div><div class="box">Agreement<br><b id="agree">—</b></div><div class="box">RSI<br><b id="rsi">—</b></div><div class="box">2 Candle<br><b id="two">—</b></div></div></section><button onclick="scan()">REFRESH NOW</button><p id="status"></p></main><script>let batch=0;const API="https://gaurav-v25-github-production.up.railway.app/api/scan";async function scan(){document.getElementById("status").textContent="Scanning…";try{let r=await fetch(API+"?batch="+batch,{cache:"no-store"}),d=await r.json();if(!r.ok)throw Error(d.detail||d.error||"API error");batch=(d.batch+1)%d.total_batches;let s=d.best;pair.textContent=s.symbol;side.textContent=(s.pass?"STRONG ":"")+s.side;side.className=s.side==="UP"?"up":"down";price.textContent=s.price;score.textContent=s.score+"/100";agree.textContent=s.agree+"/5";rsi.textContent=s.filters.rsi;two.textContent=s.filters.twoCandle?"YES":"NO";why.textContent=s.pass?"All hard filters passed":s.blockReason;status.textContent="Updated "+new Date().toLocaleTimeString()+" • "+d.source}catch(e){status.textContent="DATA ERROR: "+e.message}}scan();setInterval(scan,300000);</script></body></html>
