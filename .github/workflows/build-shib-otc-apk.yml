name: SHIB-OTC-Virtual

on:
  workflow_dispatch:
  push:
    paths:
      - 'shib-otc-apk/**'
      - '.github/workflows/build-shib-otc-apk.yml'

jobs:
  build:
    name: SHIB-OTC-Virtual APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Verify Ultimate V10 assets
        run: |
          grep -q 'Ultimate Virtual Trading' shib-otc-apk/app/src/main/assets/index.html
          grep -q 'function settleUltimate' shib-otc-apk/app/src/main/assets/app.js
          grep -q 'versionName "10.0"' shib-otc-apk/app/build.gradle

      - name: Build SHIB-OTC-Virtual APK
        working-directory: shib-otc-apk
        run: gradle --no-daemon assembleDebug

      - name: Rename APK
        run: cp shib-otc-apk/app/build/outputs/apk/debug/app-debug.apk Envarg-OTC-Ultimate-V10.apk

      - name: Upload SHIB-OTC-Virtual
        uses: actions/upload-artifact@v4
        with:
          name: SHIB-OTC-Virtual
          path: SHIB-OTC-Virtual.apk
          retention-days: 30
