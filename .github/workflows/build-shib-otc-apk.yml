name: Build SHIB OTC APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'shib-otc-apk/**'
      - '.github/workflows/build-shib-otc-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        working-directory: shib-otc-apk
        run: gradle --no-daemon assembleDebug

      - name: Rename APK
        run: cp shib-otc-apk/app/build/outputs/apk/debug/app-debug.apk SHIB-OTC-Virtual.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SHIB-OTC-Virtual-APK
          path: SHIB-OTC-Virtual.apk
          retention-days: 30
