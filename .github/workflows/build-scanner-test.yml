name: Build Gaurav Scanner Test APK
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle -p scanner-test-app assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Gaurav-Scanner-Test-APK
          path: scanner-test-app/app/build/outputs/apk/debug/app-debug.apk
