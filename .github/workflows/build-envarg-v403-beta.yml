name: Build Envarg V4.0.3 Background Beta
on:
  push:
    branches: [v4-0-3-background-scanner-plan]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build debug APK
        working-directory: olymp-otc-multiscan
        run: gradle --no-daemon assembleDebug
      - name: Verify APK signature and archive
        run: |
          set -eux
          APK=olymp-otc-multiscan/app/build/outputs/apk/debug/app-debug.apk
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -type f -name apksigner | sort -V | tail -n 1)"
          "$APKSIGNER" verify --verbose "$APK"
          unzip -t "$APK" | tail -1
          cp "$APK" Envarg-V4.0.3-Background-Beta.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Envarg-V4.0.3-Background-Beta
          path: Envarg-V4.0.3-Background-Beta.apk
